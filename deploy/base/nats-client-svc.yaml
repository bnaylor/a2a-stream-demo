apiVersion: v1
kind: Service
metadata:
  name: nats-client
  namespace: a2a-demo
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      # The local overlay turns this into a NodePort so a dev laptop can run
      # the smoke test / terminal chat client against the cluster bus:
      # NATS_URL=nats://10.3.10.<node>:30898. The demo NATS is unauthenticated
      # by design (spec §1 non-goal) — homelab LAN only, never exposed on GKE.
  type: ClusterIP
