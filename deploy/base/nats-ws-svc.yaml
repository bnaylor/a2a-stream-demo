apiVersion: v1
kind: Service
metadata:
  name: nats-ws
  namespace: a2a-demo
spec:
  selector:
    app: nats
  ports:
    - name: websocket
      port: 9222
      targetPort: 9222
      # In-cluster the web pod's nginx proxies /ws here (same-origin WebSocket).
      # The local overlay additionally exposes this as a NodePort for direct
      # browser/debug access; the gke overlay does not.
  type: ClusterIP
