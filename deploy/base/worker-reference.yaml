apiVersion: v1
kind: Pod
metadata:
  # ChatOps names pods a2a-worker-<session>, where <session> is a short word.
  name: a2a-worker-otter
  namespace: a2a-demo
  labels:
    app: a2a-worker
    # ChatOps labels worker pods with the session name at creation time;
    # this file is the REFERENCE SHAPE ChatOps uses to build the pod spec
    # programmatically (spec §4.2) — not applied as-is. Keep in sync with
    # agents/chatops/src/k8s.ts workerPodManifest().
spec:
  restartPolicy: Never
  # The a2a-worker SA carries no Role/RoleBinding, so workers still get no k8s
  # API access (spec §4.2). It is named only so GKE Workload Identity can bind
  # a GSA to it; the token itself is never mounted.
  serviceAccountName: a2a-worker
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: worker
      image: a2a-demo/worker:latest
      imagePullPolicy: Always
      env:
        - name: TASK_ID
          value: "task-REPLACE"
        - name: SESSION
          value: "otter"
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: CORRELATION_ID
          value: "correlation-REPLACE"
        - name: CONTEXT_ID
          value: "context-REPLACE"
        - name: WORKER_MODEL
          value: "claude-haiku-4-5"
        - name: WORKER_MAX_BUDGET_USD
          value: "1.50"
        # On GKE, ChatOps also passes through CLAUDE_CODE_USE_VERTEX,
        # CLOUD_ML_REGION and ANTHROPIC_VERTEX_PROJECT_ID from its own env.
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: a2a-demo-secrets
              key: ANTHROPIC_API_KEY
              optional: true
      volumeMounts:
        # Scratch space for the worker (its cwd). emptyDir: nothing survives
        # the pod, and the worker's Write tool is scoped here.
        - name: work
          mountPath: /work
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
  volumes:
    - name: work
      emptyDir: {}
