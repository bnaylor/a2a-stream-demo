apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatops
  namespace: a2a-demo
rules:
  # Namespace-scoped only — no cluster-scoped resources (spec §2 isolation rule).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
