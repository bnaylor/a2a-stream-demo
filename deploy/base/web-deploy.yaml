apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: a2a-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # Static nginx serving the built web/ UI (web/Dockerfile). The image
          # ships web/nginx.conf, which proxies /ws to the nats-ws Service so
          # the browser's WebSocket is same-origin.
          image: a2a-demo/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
