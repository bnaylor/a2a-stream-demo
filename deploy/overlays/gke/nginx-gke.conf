# nginx config for the GKE overlay. Same shape as web/nginx.conf (baked into
# the image) plus HTTP basic auth, because on GKE the web Service is a public
# LoadBalancer rather than a NodePort on a home LAN.
#
# The /ws block is identical to the one in web/nginx.conf: the browser opens a
# same-origin WebSocket at /ws and nginx proxies it to the nats-ws Service.
# Same-origin means the browser replays the Authorization header it already has
# from the page load, so the upgrade passes basic auth without extra work.
server {
    listen 80;
    root /usr/share/nginx/html;

    auth_basic "a2a demo";
    auth_basic_user_file /etc/nginx/htpasswd;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;

    location / {
        try_files $uri /index.html;
    }

    # The shell must never be cached: asset filenames are content-hashed, so a
    # stale index.html points at bundles that no longer exist after a rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /ws {
        proxy_pass http://nats-ws:9222;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
