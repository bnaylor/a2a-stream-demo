# Swap the image's nginx config for the basic-auth one, and mount the htpasswd
# file. Both are subPath mounts so they land as single files without hiding the
# rest of /etc/nginx/conf.d or /etc/nginx.
#
# The Secret is created out-of-band and NEVER committed (see deploy/README.md):
#   kubectl -n a2a-demo create secret generic web-htpasswd \
#     --from-literal=htpasswd="$(htpasswd -nbB demo '<password>')"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: a2a-demo
spec:
  template:
    spec:
      volumes:
        - name: nginx-conf
          configMap:
            name: web-nginx-gke
        - name: htpasswd
          secret:
            secretName: web-htpasswd
      containers:
        - name: web
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: htpasswd
              mountPath: /etc/nginx/htpasswd
              subPath: htpasswd
              readOnly: true
