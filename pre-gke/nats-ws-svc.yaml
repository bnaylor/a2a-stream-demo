apiVersion: v1
kind: Service
metadata:
  name: nats-ws
  namespace: a2a-demo
spec:
  selector:
    app: nats
  ports:
    - name: websocket
      port: 9222
      targetPort: 9222
      # NodePort: the browser on the LAN reaches ws://10.3.10.<node>:<nodePort>.
      # UI default (this is the WebSocket listener).
      nodePort: 30222
  type: NodePort
