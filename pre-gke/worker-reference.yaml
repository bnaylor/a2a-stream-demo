apiVersion: v1
kind: Pod
metadata:
  # ChatOps names pods a2a-worker-<session>, where <session> is a short word.
  name: a2a-worker-otter
  namespace: a2a-demo
  labels:
    app: a2a-worker
    # ChatOps labels worker pods with the session name at creation time;
    # this file is the REFERENCE SHAPE ChatOps uses to build the pod spec
    # programmatically (spec §4.2) — not applied as-is. Keep in sync with
    # agents/chatops/src/k8s.ts workerPodManifest().
spec:
  restartPolicy: Never
  # No serviceAccountName — workers get no k8s API access (spec §4.2).
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  containers:
    - name: worker
      image: 10.3.10.52:5000/a2a-demo/worker:latest
      imagePullPolicy: Always
      env:
        - name: TASK_ID
          value: "task-REPLACE"
        - name: SESSION
          value: "otter"
        - name: NATS_URL
          value: "nats://nats:4222"
        - name: CORRELATION_ID
          value: "correlation-REPLACE"
        - name: CONTEXT_ID
          value: "context-REPLACE"
        - name: WORKER_MODEL
          value: "claude-haiku-4-5"
        - name: WORKER_MAX_BUDGET_USD
          value: "1.50"
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: a2a-demo-secrets
              key: ANTHROPIC_API_KEY
      volumeMounts:
        # Scratch space for the worker (its cwd). emptyDir: nothing survives
        # the pod, and the worker's Write tool is scoped here.
        - name: work
          mountPath: /work
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
  volumes:
    - name: work
      emptyDir: {}
