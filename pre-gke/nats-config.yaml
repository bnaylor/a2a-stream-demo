apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: a2a-demo
data:
  nats.conf: |
    # Demo NATS — a2a-demo namespace only. NOT the shared prod NATS at 10.3.10.55.
    port: 4222
    http_port: 8222

    # WebSocket listener — REQUIRED: the browser UI connects via nats.ws.
    websocket {
      port: 9222
      no_tls: true
    }

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 64MB
      max_file_store: 1GB
    }

    logtime: true
