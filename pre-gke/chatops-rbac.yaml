apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatops
  namespace: a2a-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chatops
  namespace: a2a-demo
rules:
  # Namespace-scoped only — no cluster-scoped resources (spec §2 isolation rule).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chatops
  namespace: a2a-demo
subjects:
  - kind: ServiceAccount
    name: chatops
    namespace: a2a-demo
roleRef:
  kind: Role
  name: chatops
  apiGroup: rbac.authorization.k8s.io
