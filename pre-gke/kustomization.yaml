# Pre-GKE local manifests — apply with `kubectl apply -k pre-gke/` (kustomize).
# NOTE: the ChatOps/web/worker images must be built + pushed to 10.3.10.52:5000 first
# (see README.md); the placeholder Deployments will ImagePullBackOff until then.
# worker-reference.yaml is intentionally NOT in resources below — it is a reference
# shape only, not an applyable manifest.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: a2a-demo

resources:
  - 00-namespace.yaml
  - nats-config.yaml
  - nats-svc.yaml
  - nats-ws-svc.yaml
  - nats-client-svc.yaml
  - nats-sts.yaml
  - chatops-sa.yaml
  - chatops-role.yaml
  - chatops-rolebinding.yaml
  - chatops-deploy.yaml
  - web-deploy.yaml
  - web-svc.yaml
  # worker-reference.yaml is intentionally NOT applied — it is the shape
  # ChatOps uses to create worker pods programmatically (spec §4.2).
