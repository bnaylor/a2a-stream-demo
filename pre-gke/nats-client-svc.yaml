apiVersion: v1
kind: Service
metadata:
  name: nats-client
  namespace: a2a-demo
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      # NodePort so the dev laptop can run the M1 smoke test against the
      # cluster bus: NATS_URL=nats://10.3.10.<node>:<nodePort>. The demo NATS
      # is unauthenticated by design (spec §1 non-goal) — homelab LAN only.
  type: NodePort
