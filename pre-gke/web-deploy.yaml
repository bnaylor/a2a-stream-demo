apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: a2a-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          # PLACEHOLDER — static nginx serving the built web/ UI.
          image: 10.3.10.52:5000/a2a-demo/web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
